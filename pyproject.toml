[project]
name = "fusion-by-hand"
version = "0.1.0"
description = "Companion code for Sensor Fusion from First Principles (mefby.com/essays/fusion)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.scripts]
fbh = "fbh.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbh"]
